# Harnesses disponiveis para os agentes do orquestra.
#
# Um harness e a CLI que roda o agente dentro da janela tmux. O orquestra nao
# fala com nenhuma API: ele lanca o comando abaixo e passa a tarefa como ULTIMO
# argumento. Por isso qualquer CLI que aceite um prompt na linha de comando
# funciona aqui — inclusive as que voce mesmo escrever.
#
# Formato, separado por | :
#   id | rotulo | binario | comando com modelo | comando sem modelo | modelos | como instalar
#
# %M% e trocado pelo modelo escolhido. Linhas com # sao ignoradas.
# Para adicionar o seu, copie uma linha e ajuste — nao precisa recompilar nada.

claude|Claude Code|claude|claude --model %M%|claude|sonnet,opus,haiku|npm install -g @anthropic-ai/claude-code
codex|Codex|codex|codex -m %M%|codex|gpt-5,o4-mini|npm install -g @openai/codex
deepseek|DeepSeek (via Aider)|aider|aider --model deepseek/%M% --yes --message|aider --model deepseek/deepseek-chat --yes --message|deepseek-chat,deepseek-reasoner|pip install aider-install && aider-install
gemini|Gemini CLI|gemini|gemini -m %M% -p|gemini -p|gemini-2.5-pro,gemini-2.5-flash|npm install -g @google/gemini-cli
